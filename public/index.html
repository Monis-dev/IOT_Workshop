<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid Controller</title>
    <style>
      body {
        background: #111;
        color: #0df;
        font-family: sans-serif;
        text-align: center;
        padding-top: 50px;
      }
      button {
        padding: 20px;
        font-size: 20px;
        background: #0df;
        border: none;
        border-radius: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <button id="btn" onclick="startGyro()">CONNECT GYRO</button>
    <h1 id="tilt">0°</h1>

    <script>
      let lastSend = 0;
      async function startGyro() {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          await DeviceOrientationEvent.requestPermission();
        }
        document.getElementById("btn").style.display = "none";

        window.addEventListener("deviceorientation", (e) => {
          let tilt = Math.round(e.gamma || 0); // Left/Right tilt
          if (tilt > 45) tilt = 45; // Max tilt right
          if (tilt < -45) tilt = -45; // Max tilt left

          document.getElementById("tilt").innerText = tilt + "°";

          // Send to Render every 200ms (so we don't crash the server)
          if (Date.now() - lastSend > 200) {
            lastSend = Date.now();
            fetch("/update", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ tilt: tilt }),
            });
          }
        });
      }
    </script>
  </body>
</html>
